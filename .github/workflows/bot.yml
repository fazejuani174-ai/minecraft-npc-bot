name: Minecraft NPC Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Diagnosticar biblioteca NeoForge
        run: |
          node -e "
          const p = require('minecraft-protocol-forge');
          console.log('Ruta:', require.resolve('minecraft-protocol-forge'));
          console.log('Exportaciones:', Object.keys(p));
          console.log('Handshake:', typeof p.neoForgeHandshake);
          "

      - name: Iniciar bot
        env:
          MC_HOST: ${{ secrets.MC_HOST }}
          MC_PORT: ${{ secrets.MC_PORT }}
          MC_USERNAME: ${{ secrets.MC_USERNAME }}
        run: npm start
